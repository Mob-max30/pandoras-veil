<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandora's Veil | Zero-Knowledge Secret Relay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pv-dark-theme">
    <div class="pv-app-container">
        <!-- Left Obsidian Sidebar -->
        <aside class="pv-sidebar">
            <!-- Brand Title Row with Shield Icon -->
            <div class="pv-brand-header" onclick="toggleProfileModal()" title="View Device Security Credentials">
                <div class="pv-brand-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <h1 class="pv-brand-title">Pandora's Veil</h1>
            </div>

            <!-- Quick Action Buttons -->
            <div class="pv-action-menu">
                <button type="button" class="pv-action-item" onclick="openNewChatModal('peer')" title="Start a new direct chat">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>New chat</span>
                </button>
                <button type="button" class="pv-action-item" onclick="openNewChatModal('group')" title="Create an encrypted group">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span>New group</span>
                </button>
            </div>

            <!-- Scrollable Contacts & Groups List -->
            <div class="pv-scroll-sections" id="sidebar-sections-container">
                <!-- DIRECT SECTION -->
                <div class="pv-section-group">
                    <div class="pv-section-header">DIRECT</div>
                    <div class="pv-section-list" id="direct-chats-list">
                        <!-- Populated dynamically from verified server connections -->
                    </div>
                </div>

                <!-- GROUPS SECTION -->
                <div class="pv-section-group">
                    <div class="pv-section-header">GROUPS</div>
                    <div class="pv-section-list" id="group-chats-list">
                        <!-- Populated dynamically from verified server groups -->
                    </div>
                </div>
            </div>

            <!-- Bottom Fingerprint Footer -->
            <div class="pv-sidebar-footer" onclick="toggleProfileModal()" title="Click to view full identity credentials & account settings">
                <div class="pv-footer-label">Your fingerprint</div>
                <div class="pv-footer-fp" id="my-fingerprint">INITIALIZING</div>
            </div>
        </aside>

        <!-- Right Main Chat Workspace -->
        <main class="pv-chat-workspace">
            <!-- Workspace Header -->
            <header class="pv-workspace-header">
                <div class="pv-contact-info" onclick="openContactDetailsModal()" title="View peer identity & fingerprint details">
                    <div class="pv-contact-avatar" id="active-header-avatar">M</div>
                    <div class="pv-contact-meta">
                        <div class="pv-contact-name" id="active-contact-title">No Active Chat</div>
                        <div class="pv-contact-status" id="active-status-line">
                            <span class="pv-status-verified" id="active-status-text">Online · End-to-end verified</span>
                        </div>
                    </div>
                </div>

                <!-- Header Actions & Connection State -->
                <div class="pv-header-controls">
                    <div class="pv-connection-pill">
                        <span class="pv-status-dot"></span>
                        <span id="header-conn-status">Connected</span>
                    </div>
                    <div class="pv-menu-dropdown-wrapper">
                        <button type="button" class="pv-icon-btn" onclick="toggleOptionsMenu(event)" title="Options & Settings">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle><circle cx="5" cy="12" r="2"></circle></svg>
                        </button>
                        <div id="options-dropdown" class="pv-dropdown-menu hidden">
                            <button type="button" class="pv-dropdown-item" onclick="openDisappearingModal()">
                                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                <span>Disappearing Messages</span>
                            </button>
                            <button type="button" class="pv-dropdown-item" onclick="openSecretDepositModal()">
                                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <span>Deposit Secret</span>
                            </button>
                            <button type="button" class="pv-dropdown-item" onclick="openContactDetailsModal()">
                                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                <span>Contact Details</span>
                            </button>
                            <button type="button" class="pv-dropdown-item pv-danger-text" onclick="confirmDeleteAccount()">
                                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                <span>Delete Account</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Scrollable Messages Flow -->
            <div class="pv-messages-scroll" id="chat-messages-scroll">
                <div class="pv-messages-container" id="chat-messages-container">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Bottom Floating Input Bar -->
            <footer class="pv-input-dock">
                <form id="message-form" class="pv-input-bar">
                    <button type="button" class="pv-clip-btn" onclick="openSecretDepositModal()" title="Deposit confidential secret or file">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>

                    <input type="text" id="chat-input" placeholder="Type a message or drop files..." autocomplete="off" autofocus>
                    
                    <button type="submit" class="pv-send-btn" id="send-button" title="Send message">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-backdrop" class="pv-modal-backdrop hidden" onclick="handleBackdropClick(event)">
        <div class="pv-modal-card" onclick="event.stopPropagation()">
            <div class="pv-modal-header">
                <h3 id="modal-title">Details</h3>
                <button type="button" class="pv-modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="pv-modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Device Initialization Screen -->
    <div id="init-overlay" class="pv-init-overlay hidden">
        <div class="pv-init-card">
            <div class="pv-init-header">
                <div class="pv-brand-icon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <h1 class="pv-brand-title">Pandora's Veil</h1>
            </div>
            <h2 class="pv-init-title">Initialize your Device</h2>

            <form id="init-form" class="pv-init-form" onsubmit="handleInitSubmit(event)">
                <div class="pv-init-input-box">
                    <input type="text" id="init-handle-input" placeholder="Enter Your Device Handle" required autofocus autocomplete="off">
                </div>
                <div id="init-error-msg" class="pv-error-box hidden"></div>
                <button type="submit" class="pv-init-btn" id="init-submit-button">
                    <span>Initialize</span>
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
